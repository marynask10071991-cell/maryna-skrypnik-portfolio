const $=id=>document.getElementById(id), esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let d;try{d=JSON.parse(localStorage.getItem("my-intentions-private-v1")||"null")}catch(e){} if(!d)d={hyp:{},days:{},top:[0,3,4],notes:{},months:{},identity:"#participant"};

function labelFor(id){for(let g=0;g<8;g++){let x=allHyp(g).find(h=>h.id===id);if(x)return {g,text:x.text}}return {g:0,text:id}}

function updateWeekPlan(id) {

}
let page="today",selectedDate=localDate(),goal=2,weekDate=localDate();
const sectionNames=[["today","◉","Сегодня"],["choose","✳︎","Гипотезы"],["calendar","▦","Календарь"],["report","▤","Отчёт"],["progress","◷","Аналитика"]];

function dayCard(iso){let a=d.days[iso]||{items:[],answers:{},diary:""},plan=plannedFor(iso),visible=[...new Set([...plan,...a.items])];return '<div class="card day-log">'+ (visible.length?visible.map(id=>{let h=labelFor(id),v=a.answers[id]||{},cnt=Object.keys(d.days).filter(when=>d.days[when].answers[id]?.status==="post").length,prior=Object.keys(d.days).filter(when=>when<iso&&d.days[when].answers[id]?.status==="done").sort(),last=prior.length?d.days[prior[prior.length-1]].answers[id]:null,completedCount=prior.length+(v.status==="done"?1:0),stalled=prior.length>=2&&v.progress==="no";return '<div class="card" style="box-shadow:none"><div class="muted">'+esc(SECTIONS[h.g][0])+'</div><h3>'+esc(h.text)+'</h3><div class="row" style="justify-content:flex-start;flex-wrap:wrap">'+[["done","✓ Сделано"],["partial","Частично"],["post","Отложила"]].map(x=>'<button class="chip '+(v.status===x[0]?'active':'')+'" data-state="'+esc(id)+'" data-val="'+x[0]+'">'+x[1]+'</button>').join("")+'</div><label>'+(v.status==="done"?"Что именно сделано?":v.status==="partial"?"Что удалось сделать частично?":"Комментарий (необязательно)")+'</label><textarea class="field" rows="2" data-comment="'+esc(id)+'" placeholder="'+(v.status==="done"?"Опиши конкретный результат, например: подготовила и опубликовала пост":v.status==="partial"?"Что уже получилось?":"Мои впечатления и наблюдения")+'">'+esc(v.note)+'</textarea>'+(v.status==="done"&&last?'<div class="notice"><b>Прошлый результат:</b> '+esc(last.note||"Отмечено без комментария")+'</div><label>Что изменилось по сравнению с прошлой попыткой?</label><textarea class="field" rows="2" data-difference="'+esc(id)+'" placeholder="В чём новый результат или отличие?">'+esc(v.difference)+'</textarea><label>Есть продвижение к намерению?</label><select class="field" data-progress="'+esc(id)+'"><option value="" '+(!v.progress?'selected':'')+'>Пока не оценила</option><option value="yes" '+(v.progress==='yes'?'selected':'')+'>Да, есть новый результат</option><option value="same" '+(v.progress==='same'?'selected':'')+'>Поддерживаю результат / полезная привычка</option><option value="no" '+(v.progress==='no'?'selected':'')+'>Нет, всё повторяется без продвижения</option></select>' :'')+(stalled?'<div class="notice"><b>Пора пересмотреть подход.</b> Ты отмечала выполнение минимум три раза, но сейчас не видишь продвижения. Можно изменить действие или обсудить ситуацию с ментором.</div>':'')+(v.status==="post"?'<label>Почему отложила?</label><textarea class="field" rows="2" data-reason="'+esc(id)+'" placeholder="Что помешало?">'+esc(v.reason)+'</textarea>':'')+(cnt>=3?'<div class="notice">Гипотеза переносилась '+cnt+' раза. Возможно, стоит изменить шаг или подход.</div>':'')+(plan.includes(id)?'':'<button class="link" data-remove="'+esc(id)+'">Убрать из этого дня</button>')+'</div>'}).join(""):'')+'<label for="day-diary">Заметка о дне</label><textarea class="field" id="day-diary" data-diary rows="2" placeholder="Что сегодня произошло?">'+esc(a.diary)+'</textarea></div>'}
function renderToday() {
  const items = plannedFor(selectedDate);
  const groups = new Map();
  for (const id of items) {
    const { g, text } = labelFor(id);
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(text);
  }
  const list = items.length
    ? [...groups].sort(([a], [b]) => a - b).map(([g, entries]) =>
      '<div class="plan-group"><h3>' + esc(SECTIONS[g][0]) + '</h3><ul class="plan-list">' +
      entries.map(text => '<li>' + esc(text) + '</li>').join("") + '</ul></div>'

      ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i] + '<b>' + Number(date.slice(-2)) + '</b>' +

function renderChoose(){const items=plannedFor(selectedDate),count=items.length;return '<h2>Гипотезы на неделю</h2><div class="notice">'+weekLabel(selectedDate)+' · Можно выбрать из разных намерений.</div><div class="card"><label>Намерение</label><select id="goal-select" class="field">'+SECTIONS.map((g,i)=>'<option value="'+i+'" '+(i===goal?'selected':'')+'>'+esc(g[0])+'</option>').join("")+'</select><p class="muted">'+esc(SECTIONS[goal][1])+'</p></div><div class="card"><div class="row"><h3 style="margin:0">Гипотезы</h3><span class="pill">'+allHyp(goal).length+' в намерении</span></div><p class="muted">Нажимай на любые гипотезы — галочки сохраняются, даже если переключаешь намерение.</p>'+allHyp(goal).map(h=>'<button class="choice '+(items.includes(h.id)?'active':'')+'" aria-pressed="'+items.includes(h.id)+'" data-add="'+esc(h.id)+'"><span style="display:inline-block;width:25px;font-size:18px;color:#91577a">'+(items.includes(h.id)?'☑':'☐')+'</span>'+esc(h.text)+'</button>').join("")+'</div><div class="card"><h3>Добавить своё</h3><textarea class="field" id="custom-text" rows="2" placeholder="Новая гипотеза или действие"></textarea><div class="row"><button class="secondary" data-add-custom="hyp">+ Гипотеза в карту</button><button class="secondary" data-add-custom="week">+ На эту неделю</button></div></div><div class="card" style="position:sticky;bottom:76px;z-index:10;box-shadow:0 8px 30px #aa7a9940"><div class="row"><b>Выбрано на неделю</b><span class="pill" id="selected-count">'+count+'</span></div><button class="primary full" data-goto="today">Готово</button></div>'}
function renderCalendar(){return '<h2>Календарь активности</h2><div class="card"><label>Выбери неделю</label><input id="week-date" type="date" class="field" value="'+weekDate+'"></div>'+weekPicker(weekDate)+'<div class="card"><h3>Записи за неделю</h3>'+Array.from({length:7},(_,i)=>{let dt=shift(startWeek(weekDate),i),a=d.days[dt],n=a?.items.length||0;return '<button data-date="'+dt+'" class="choice"><b>'+dateText(dt)+'</b> · '+(n?n+' гипотез':'Нет записи')+' <span style="float:right">›</span></button>'}).join("")+'<p class="muted">Нет записи ≠ нет действий. Можно заполнить прошедшую дату.</p></div>'}
function recordsInWeek(date){let mo=startWeek(date),out=[];for(let i=0;i<7;i++){let iso=shift(mo,i),a=d.days[iso];if(a)for(let id of a.items){let v=a.answers[id]||{},h=labelFor(id);out.push({iso,id,g:h.g,text:h.text,status:v.status||"none",note:v.note||"",reason:v.reason||"",difference:v.difference||"",progress:v.progress||""})}}return out}
function weekReport(){let arr=recordsInWeek(weekDate), by={};for(let r of arr){if(!by[r.g])by[r.g]=[];by[r.g].push(r)}let start=startWeek(weekDate),end=shift(start,6),ext=d.notes[start]||{},names={done:"Выполнено",partial:"Частично",post:"Отложено",none:"Без отметки"};let txt="Недельный отчёт\n"+(d.identity||"#participant")+" "+start.split("-").reverse().join(".")+"–"+end.split("-").reverse().join(".")+"\n\n";if(ext.extra)txt+=ext.extra+"\n\n";Object.keys(by).sort((a,b)=>a-b).forEach(g=>{txt+=SECTIONS[g][0]+"\n\n"+SECTIONS[g][1]+"\n\n"+by[g].map(r=>r.text+" — "+names[r.status]+(r.note?". "+r.note:"")+(r.difference?" Отличие от прошлого раза: "+r.difference:"")+(ext.includeWhy&&r.reason?" Причина: "+r.reason:"")).join("\n")+"\n\n"});txt+="Самоуважение — "+(ext.respect??80)+"%\nВовлечённость — "+(ext.engagement??80)+"%\nУровень счастья — "+(ext.happiness??80)+"%";return {txt,start,arr}}
function renderReport(){let r=weekReport(),ext=d.notes[r.start]||{},byDone=r.arr.filter(x=>x.status==="done").length,miss=r.arr.filter(x=>x.status==="post").length,days=new Set(r.arr.map(x=>x.iso)).size;return '<h2>Недельный отчёт</h2><div class="notice">В программе окно сдачи открывается в пятницу на 24–48 часов. Здесь ты можешь проверить отчёт в любой день.</div><div class="card"><label>Неделя</label><input id="week-date" type="date" class="field" value="'+weekDate+'"><div class="grid3"><div class="metric"><b>'+days+'/7</b><span class="muted">дней с записями</span></div><div class="metric"><b>'+byDone+'</b><span class="muted">сделано</span></div><div class="metric"><b>'+miss+'</b><span class="muted">переносов</span></div></div><label>Дополнительные результаты и впечатления</label><textarea class="field" id="report-extra" rows="3" placeholder="Что ещё произошло за неделю?">'+esc(ext.extra)+'</textarea><div class="grid3">'+[["respect","Самоуважение"],["engagement","Вовлечённость"],["happiness","Счастье"]].map(x=>'<div><label>'+x[1]+'</label><input class="field" type="number" min="0" max="100" data-score="'+x[0]+'" value="'+(ext[x[0]]??80)+'"></div>').join("")+'</div><label class="checkboxrow"><input type="checkbox" id="share-why" '+(ext.includeWhy?'checked':'')+'>Включить причины переносов в отчёт</label></div><div class="card"><h3>Предпросмотр для Telegram</h3><pre id="preview" style="white-space:pre-wrap;font:13px -apple-system,system-ui;line-height:1.55">'+esc(r.txt)+'</pre></div><button class="primary full" data-copy="report">Скопировать отчёт</button><button class="secondary full" data-share="report">Поделиться в Telegram</button><p class="muted">Ничего не отправляется автоматически. Перед отправкой ты сама проверяешь текст.</p>'}
function renderProgress(){let all=Object.entries(d.days),actions=all.reduce((sum,[_,x])=>sum+x.items.length,0),done=all.reduce((sum,[_,x])=>sum+Object.values(x.answers).filter(v=>v.status==="done").length,0);let start=startWeek(localDate());let month=localDate().slice(0,7),previous=localDate(new Date(new Date().getFullYear(),new Date().getMonth()-1,1)).slice(0,7),cur=d.months[month]||{},prev=d.months[previous]||{};return '<h2>Моя динамика</h2><div class="card"><div class="grid3"><div class="metric"><b>'+all.length+'</b><span class="muted">дней с данными</span></div><div class="metric"><b>'+actions+'</b><span class="muted">выбрано</span></div><div class="metric"><b>'+done+'</b><span class="muted">выполнено</span></div></div></div><div class="card"><h3>Мои топ-3 намерения</h3>'+SECTIONS.map((s,i)=>'<button class="choice '+(d.top.includes(i)?'active':'')+'" data-top="'+i+'">'+(d.top.includes(i)?'★ ':'☆ ')+esc(s[0])+'</button>').join("")+'</div><div class="card"><h3>Месячная самооценка</h3><p class="muted">Оцени каждую сферу от 1 до 10. Приложение сравнит оценки с предыдущим месяцем.</p>'+["Отношения","Здоровье","Деятельность","Окружение"].map((x,i)=>'<label>'+x+' · было '+(prev[i]||"—")+', сейчас '+(cur[i]||"—")+'</label><input type="range" min="1" max="10" value="'+(cur[i]||5)+'" data-month="'+i+'">').join("")+'<label>Что изменилось и что могло повлиять?</label><textarea class="field" id="month-note" rows="3" placeholder="Мои мысли и наблюдения...">'+esc(cur.note||"")+'</textarea></div><div class="card"><h3>Резервная копия</h3><p class="muted">Данные хранятся в этом браузере на iPhone. Регулярно сохраняй копию, особенно перед очисткой Safari.</p><button class="secondary full" data-export="1">Скачать резервную копию JSON</button></div><a href="/logout" class="muted">Выйти из приложения</a>'}
function render(){navbar();$("main").innerHTML=page==="today"?renderToday():page==="choose"?renderChoose():page==="calendar"?renderCalendar():page==="report"?renderReport():renderProgress()}
document.addEventListener("click",async e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.nav){page=b.dataset.nav;render();return}if(b.dataset.goto){page=b.dataset.goto;render();window.scrollTo(0,0);return}if(b.dataset.date){selectedDate=b.dataset.date;weekDate=b.dataset.date;page="today";render();return}if(b.dataset.add){updateWeekPlan(b.dataset.add);return}if(b.dataset.remove){const day=dayObj(selectedDate);day.items=day.items.filter(id=>id!==b.dataset.remove);save();render();return}if(b.dataset.state){recordAnswer(b.dataset.state).status=b.dataset.val;save();render();return}if(b.dataset.addCustom){let v=$("custom-text").value.trim();if(!v)return;let id="user-"+Date.now();(d.hyp[goal]||(d.hyp[goal]=[])).push({id,text:v});if(b.dataset.addCustom==="week"){(d.plans ||= {})[startWeek(selectedDate)]=[...plannedFor(selectedDate),id]}save();render();return}if(b.dataset.top){let i=Number(b.dataset.top);d.top=d.top.includes(i)?d.top.filter(v=>v!==i):d.top.length<3?[...d.top,i]:d.top;save();render();return}if(b.dataset.copy){try{await navigator.clipboard.writeText(weekReport().txt);alert("Отчёт скопирован")}catch(x){alert("Не удалось скопировать")};return}if(b.dataset.share){window.open("https://t.me/share/url?url=&text="+encodeURIComponent(weekReport().txt),"_blank");return}if(b.dataset.export){let blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="moi-namereniya-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
document.addEventListener("change",e=>{let t=e.target;if(t.dataset.progress){recordAnswer(t.dataset.progress).progress=t.value;save();render();}if(t.id==="goal-select"){goal=Number(t.value);render()}if(t.id==="date-field"){if(t.value){selectedDate=t.value;weekDate=t.value}render()}if(t.id==="week-date"){weekDate=t.value;selectedDate=t.value;render()}if(t.id==="share-why"){(d.notes[startWeek(weekDate)]||(d.notes[startWeek(weekDate)]={})).includeWhy=t.checked;save();render()}if(t.dataset.score){(d.notes[startWeek(weekDate)]||(d.notes[startWeek(weekDate)]={}))[t.dataset.score]=Number(t.value);save();render()}if(t.dataset.month){(d.months[localDate().slice(0,7)]||(d.months[localDate().slice(0,7)]={}))[t.dataset.month]=Number(t.value);save();render()}});
document.addEventListener("input",e=>{let t=e.target;if(t.dataset.comment){recordAnswer(t.dataset.comment).note=t.value;save()}if(t.dataset.reason){recordAnswer(t.dataset.reason).reason=t.value;save()}if(t.dataset.difference){recordAnswer(t.dataset.difference).difference=t.value;save()}if(t.dataset.diary!==undefined){dayObj(selectedDate).diary=t.value;save()}if(t.id==="report-extra"){(d.notes[startWeek(weekDate)]||(d.notes[startWeek(weekDate)]={})).extra=t.value;save()}if(t.id==="month-note"){(d.months[localDate().slice(0,7)]||(d.months[localDate().slice(0,7)]={})).note=t.value;save()}});
render();
fetch("/api/hypotheses",{credentials:"same-origin"}).then(r=>{if(!r.ok)throw Error("private data unavailable");return r.json()}).then(a=>{if(Array.isArray(a)&&a.length===8){SECTIONS.splice(0,8,...a);render()}}).catch(()=>{});
})();
</script></body></html>
