<script>
(function(){

const SECTIONS=[["Здоровье и тело","Я забочусь о своём здоровье и энергии.",["Прогуляться 30 минут","Выбрать приятную физическую активность","Подготовить полезный завтрак","Запланировать время отдыха"]],["Женственность","Я уделяю внимание красоте и внутренней гармонии.",["Записать три желания","Выделить время для себя","Составить список вдохновляющих занятий"]],["Отношения","Я развиваю тёплые, доверительные отношения.",["Организовать совместный вечер","Поблагодарить партнёра","Обсудить общие планы","Предложить новое совместное занятие"]],["Деятельность","Я развиваюсь в любимом деле.",["Сделать один шаг по проекту","Подготовить публикацию","Попросить обратную связь","Подвести итоги проекта"]],["Деньги","Я развиваю свою финансовую устойчивость.",["Проанализировать расходы","Подготовить предложение клиенту","Изучить новую возможность заработка"]],["Уровень нормы","Я постепенно повышаю качество повседневной жизни.",["Записать желания","Выбрать приятную активность","Попробовать новое место"]],["Окружение","Я развиваю интересные знакомства и дружбу.",["Написать знакомому человеку","Посетить интересное мероприятие","Предложить совместную встречу"]],["Дом и уют","Я создаю комфортную домашнюю атмосферу.",["Продумать интерьер","Сделать небольшой шаг к уюту","Выбрать идею домашнего оформления"]]];
const $=id=>document.getElementById(id), esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let d;try{d=JSON.parse(localStorage.getItem("my-intentions-private-v1")||"null")}catch(e){} if(!d)d={hyp:{},days:{},top:[0,3,4],notes:{},months:{},identity:"#participant"};
const save=()=>localStorage.setItem("my-intentions-private-v1",JSON.stringify(d));

  const today = localDate();
  if (d.visits?.[today]) return false;

  if (!d.visitTrackingSince || today < d.visitTrackingSince) d.visitTrackingSince = today;

  return true;
}
const localDate=dt=>{let t=dt||new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
const shift=(iso,n)=>{let v=new Date(iso+"T12:00:00");v.setDate(v.getDate()+n);return localDate(v)};
const startWeek=iso=>{let n=(new Date(iso+"T12:00:00").getDay()+6)%7;return shift(iso,-n)};
const dateText=iso=>new Date(iso+"T12:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
const key=(g,i)=>g+"-"+i;
function allHyp(g){let base=SECTIONS[g][2].map((text,i)=>({id:key(g,i),text:text}));return base.concat((d.hyp[g]||[]).map(x=>({id:x.id,text:x.text})))}
function labelFor(id){for(let g=0;g<8;g++){let x=allHyp(g).find(h=>h.id===id);if(x)return {g,text:x.text}}return {g:0,text:id}}
function dayObj(iso){return d.days[iso]||(d.days[iso]={items:[],answers:{},diary:""})}
function plannedFor(iso) {
  return d.plans?.[startWeek(iso)] || [];
}
function updateWeekPlan(id) {
  const monday = startWeek(selectedDate);
  const ids = plannedFor(selectedDate);
  const next = ids.includes(id) ? ids.filter(item => item !== id) : [...ids, id];
  (d.plans ||= {})[monday] = next;
  if (!d.firstReportWeek || monday < d.firstReportWeek) d.firstReportWeek = monday;
  save();
  $("selected-count").textContent = String(next.length);
  document.querySelectorAll("[data-add]").forEach(button => {
    const selected = next.includes(button.dataset.add);
    button.classList.toggle("active", selected);
    button.setAttribute("aria-pressed", String(selected));
    button.querySelector("span").textContent = selected ? "☑" : "☐";
  });
}
function recordAnswer(id) {
  const day = dayObj(selectedDate);
  if (!day.items.includes(id)) day.items.push(id);
  return day.answers[id] ||= {};
}
function weekLabel(iso) {
  const monday = startWeek(iso);
  const sunday = shift(monday, 6);
  const full = date => new Date(date + "T12:00:00").toLocaleDateString("ru-RU",{day:"numeric", month:"long"});
  const start = monday.slice(0, 7) === sunday.slice(0, 7) ? Number(monday.slice(-2)) : full(monday);
  return start + "–" + full(sunday);

function dictate(button) {
  const field = $(button.dataset.dictate);
  const status = $(button.dataset.dictate+"-status");
  if (activeDictation?.button === button) {
    activeDictation.recognition.stop();
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const keyboard = () => {
    status.textContent = "Открой клавиатуру и нажми на её микрофон.";
    field.focus();
  };
  if (!SpeechRecognition) { keyboard(); return; }
  if (activeDictation) {
    const previous = activeDictation;
    activeDictation = undefined;
    previous.button.textContent = "🎙 Диктовать";
    $(previous.button.dataset.dictate+"-status").textContent = "";
    previous.recognition.abort();
  }

  const session = {recognition,button};

  recognition.lang = "ru-RU";

    if (activeDictation !== session || !field.isConnected) return;

      if (!event.results[i].isFinal) continue;
      const text = event.results[i][0].transcript.trim();
      if (!text) continue;

      field.dispatchEvent(new Event("input",{bubbles:true}));
    }
  };
  recognition.onerror = () => { if (activeDictation === session) keyboard(); };
  recognition.onend = () => {
    if (activeDictation !== session) return;
    activeDictation = undefined;
    button.textContent = "🎙 Диктовать";
    if (status.textContent === "Слушаю…") status.textContent = "Текст можно отредактировать.";
  };

    recognition.start();
    button.textContent = "Остановить";

    activeDictation = undefined;
    keyboard();
  }
}

function summarizeWeeks(weeks) {
  const entriesById = new Map();
  for (const monday of weeks) {

    const plan = plannedFor(monday);
    for (const id of new Set([...plan, ...records.map(record => record.id), ...Object.keys(d.weekReviews?.[monday]||{})])) {
      if (!entriesById.has(id)) entriesById.set(id,{id,planned:0,records:[],responses:[]});
      const entry = entriesById.get(id);
      if (plan.includes(id)) entry.planned++;
      entry.records.push(...records.filter(record => record.id === id));

function zoneFor(records) {
  const marked = records.filter(record => record.recorded);
  const latest = marked[marked.length-1];
  if (!latest) return {color:"unmarked",reason:"Пока нет отметок"};
  const postponed = marked.filter(record => record.status === "post").length;
  const completed = marked.filter(record => record.status === "done").length;
  if (latest.progress === "no" && completed >= 3) return {color:"red",reason:"Три или больше выполнений, продвижение пока не отмечено"};
  if (latest.status === "post" && postponed >= 2) return {color:"red",reason:"Отложено несколько раз"};
  if (latest.progress === "no") return {color:"yellow",reason:"Пока не видно продвижения"};
  if (latest.status === "post") return {color:"yellow",reason:"Отложено"};
  if (latest.status === "partial") return {color:"yellow",reason:"Сделано частично"};
  if (latest.progress === "yes") return {color:"green",reason:"Есть продвижение"};
  if (latest.progress === "same") return {color:"green",reason:"Результат поддерживается"};
  if (latest.status === "done") return {color:"green",reason:"Есть выполненное действие"};

function monthPeriods() {
  const today = localDate();

  const dates = [...Object.keys(d.plans||{}).filter(iso=>d.plans[iso].length),
    ...Object.keys(d.days).filter(iso=>d.days[iso].items.length || d.days[iso].diary),
    ...Object.keys(d.notes),...Object.keys(d.weekReviews||{})].filter(iso=>iso<=today).sort();
  let first = startWeek((d.firstReportWeek && d.firstReportWeek<=thisWeek) ? d.firstReportWeek : dates[0] || thisWeek);
  if (dates[0] && dates[0]<first) first = startWeek(dates[0]);
  const periods = [];
  for (let monday=first; monday<=thisWeek; monday=shift(monday,28)) {
    const weeks = Array.from({length:4},(_,i)=>shift(monday,i*7));
    periods.unshift({start:monday,weeks,finished:shift(monday,28)<=thisWeek,closed:weeks.filter(week=>week<thisWeek).length});

function pulseGradient(tally, focus) {

  ).join("");

      periods.map((p,i)=>'<option value="'+i+'"'+(i===monthPeriod?' selected':'')+'>'+periodTitle(p)+'</option>').join("")+'</select>' : '')+
    (!period.finished?'<p class="muted">Завершено недель: '+period.closed+' из 4.</p>':'')+
    (!period.finished && completedIndex>=0 ? '<button class="secondary full" data-view-period="'+completedIndex+'">Открыть готовый отчёт · '+periodTitle(periods[completedIndex])+'</button>' : '')+'</div>'+
    monthlyVisual(byWeek,entries)+(highlights?'<section class="card"><h3>Главные итоги по неделям</h3>'+highlights+'</section>':'')+
    (notes ? '<details class="card report-details no-print"><summary>Заметки и самооценка по неделям</summary><div class="report-text">'+esc(notes)+'</div></details>' : '')+
    '<div class="no-print"><div class="report-toolbar"><button class="secondary" data-copy-analysis="month">Скопировать для ChatGPT</button>'+
    '<button class="primary" data-print="month">Сохранить PDF</button></div>'+
    '<label for="month-analysis">Разбор ChatGPT для PDF</label><textarea class="field" id="month-analysis" rows="3" placeholder="Вставь сюда разбор, если хочешь включить его в PDF">'+esc(commentary)+'</textarea></div>'+
    '<section id="printed-analysis" class="hidden"><h3>Разбор ChatGPT</h3><div class="report-text"></div></section></section>';
}
function analysisPrompt(monthly) {
  const instruction = "Проанализируй мои гипотезы по сферам. По каждой покажи, что я сделала, какие изменения я описала и что повторяется или не получается. Используй ответы на итоговые вопросы, чтобы выделить фактические изменения и причины трудностей. Объясни зелёную, жёлтую и красную зоны, опираясь на записи. Отдельно укажи, где данных мало. Не считай отсутствие отметки невыполнением. Не придумывай результатов. Пиши простыми словами.";
  if (!monthly) return instruction+"\n\n"+weekReport().txt;
  const {period,entries,byWeek} = monthReport();
  const weeks = byWeek.map(({week,planned,done,partial,post})=>weekLabel(week)+": в плане "+planned+", сделано "+done+", частично "+partial+", переносов "+post).join("\n");
  return [instruction+" Сравни четыре недели и предложи короткий итог для PDF.",periodTitle(period),weeks,reportPlain(entries,false),monthlyNotes(period)].filter(Boolean).join("\n\n");
}
async function copyAnalysis(monthly) {

    await navigator.clipboard.writeText(analysisPrompt(monthly));
    alert("Скопировано. Вставь текст в ChatGPT.");
  } catch {
    alert("Не удалось скопировать. Проверь доступ к буферу обмена.");
  }
}
function printMonth() {

function visitVisual(monday) {
  const today = localDate();
  const days = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
  const labels = {visited:"Открывала приложение",missed:"Открытие не зафиксировано",unknown:"Нет данных",future:"День ещё не наступил"};
  const symbols = {visited:"✓",missed:"−",unknown:"·",future:"○"};
  let visits = 0;
  let tracked = 0;
  const tiles = days.map((day,i)=>{
    const iso = shift(monday,i);
    const state = d.visits?.[iso] ? "visited" : iso>today ? "future" :
      !d.visitTrackingSince || iso<d.visitTrackingSince ? "unknown" : "missed";
    if (state==="visited") visits++;
    if (state==="visited" || state==="missed") tracked++;
    const label = dateText(iso)+" · "+labels[state];
    return '<li class="visit-tile '+state+(iso===today?' today':'')+'" aria-label="'+esc(label)+'" title="'+esc(label)+'"><span>'+day+'</span><b aria-hidden="true">'+symbols[state]+'</b><span>'+Number(iso.slice(-2))+'</span></li>';
  }).join("");
  const info = tracked ? 'Дней с заходом — '+visits : 'За эту неделю история открытий ещё не записывалась.';
  return '<section class="card visit-card"><h3>Мои заходы</h3><p class="page-intro">'+info+'</p>'+
    '<ol class="visit-strip">'+tiles+'</ol>'+
    '<p class="visit-legend">✓ Заходила &nbsp; − Без захода &nbsp; · Нет данных &nbsp; ○ Впереди</p></section>';
}
const reflectionScores = [["respect","Самоуважение"],["engagement","Вовлечённость"],["happiness","Счастье"]];
function reflectionCard(ext) {
  const scores = reflectionScores.map(([key,title])=>{

    return '<div class="score-panel"><label for="score-'+key+'">'+title+'</label><div class="score-value">'+
      '<input class="field" id="score-'+key+'" type="number" inputmode="numeric" min="0" max="100" placeholder="—" data-score="'+key+'" value="'+value+'"><span>%</span></div>'+
      '<span class="score-meter" aria-hidden="true"><span id="fill-'+key+'" style="width:'+Number(value)+'%"></span></span></div>';
  }).join("");
  return '<section class="card reflection-card"><h3>Как я себя чувствовала</h3><p class="page-intro">Твоя самооценка за неделю</p>'+
    '<div class="score-grid">'+scores+'</div><label for="report-extra">Что запомнилось на этой неделе?</label>'+
    '<textarea class="field" id="report-extra" rows="3" placeholder="Мысль, открытие или просто момент для себя">'+esc(ext.extra)+'</textarea></section>';

const reviewPrompts = {
  done:"Что изменилось после того, как ты это сделала?",
  partial:"Что получилось и что помешало довести до конца?",
  post:"Что помешало сделать это на этой неделе?",
  none:"Что было с этой гипотезой на неделе?"
};
function reviewQuestions(report) {
  return [...report.entries.values()].map(entry=>{
    const marked = entry.records.filter(record=>record.status!=="none");
    const last = marked[marked.length-1];
    const {g,text} = labelFor(entry.id);
    return {id:entry.id,g,text,status:last?.status||"none",hasContext:Boolean(last?.note||last?.reason||last?.difference),answer:entry.responses[0]?.text||""};
  }).sort((a,b)=>Number(a.status==="none")-Number(b.status==="none")||Number(a.hasContext)-Number(b.hasContext));
}
function reviewCompletion(report, questions) {
  const highlight = d.notes[report.start]?.reviewHighlight?.trim();
  const ready = Boolean(highlight) && questions.length>0 && questions.every(question=>question.answer);
  const submitted = d.closedWeeks?.[report.start];
  const closed = ready && submitted?.ids.length===questions.length && questions.every(question=>submitted.ids.includes(question.id));
  return {highlight,ready,closed};
}
function reviewCard(report) {
  const questions = reviewQuestions(report);
  if (!questions.length) return "";
  const answered = questions.filter(question=>question.answer);
  const resultSpheres = new Set(answered.filter(question=>question.status==="done").map(question=>question.g)).size;
  const barriers = answered.filter(question=>question.status==="partial"||question.status==="post").length;
  const summary = answered.length
    ? 'Ответов: '+answered.length+' из '+questions.length+'.'+(resultSpheres?' Сфер с описанным результатом: '+resultSpheres+'.':'')+(barriers?' Уточнений о препятствиях: '+barriers+'.':'')
    : 'Пара коротких вопросов о том, что получилось и что помешало. Можно ответить голосом.';
  const {highlight,ready,closed} = reviewCompletion(report,questions);
  const actions = closed
    ? '<p class="notice" role="status">Отчёт сдан. Неделя закрыта.</p><button class="secondary" data-reopen-week="1">Открыть неделю для правки</button>'
    : '<div class="report-toolbar"><button class="'+(ready?'secondary':'primary')+'" data-review-week="'+report.start+'">'+
      (ready?'Проверить ответы':answered.length?'Продолжить анкету':'Ответить на вопросы')+'</button>'+
      '<button class="primary" data-close-week="1" '+(ready?'':'disabled')+'>Сдать отчёт и закрыть неделю</button></div>'+
      (!ready?'<p class="muted">Для сдачи ответь на все вопросы и заполни главный итог.</p>':'');
  return '<section class="card week-review-card"><h3>Итоги недели</h3><p class="page-intro">'+esc(summary)+'</p>'+
    (highlight?'<div class="story"><h3>Главный итог</h3><p class="report-text">'+esc(highlight)+'</p></div>':'')+actions+'</section>';
}
function renderReview() {
  const report = weekReport();
  const questions = reviewQuestions(report);
  if (reviewStep===questions.length && questions.length) {
    const highlight = d.notes[report.start]?.reviewHighlight || "";
    return '<h2 class="page-title">Итоги недели</h2><p class="review-kicker">'+weekLabel(report.start)+'</p>'+
      '<section class="card review-card"><h3 class="review-question">Какой главный итог недели хочешь запомнить?</h3>'+
      '<p class="page-intro">Можно назвать одно изменение или то, что хочешь попробовать на следующей неделе. Этот ответ появится в отчёте отдельно.</p>'+
      '<div class="note-heading"><label for="review-highlight">Главный итог</label><button type="button" class="dictation" data-dictate="review-highlight">🎙 Диктовать</button></div>'+
      '<textarea class="field" id="review-highlight" rows="4" placeholder="Например, договариваться заранее оказалось проще">'+esc(highlight)+'</textarea>'+
      '<p class="voice-status" id="review-highlight-status" role="status"></p>'+
      '<div class="report-toolbar"><button class="secondary" data-review-move="-1">Назад</button><button class="primary" data-review-finish="1" id="review-finish" '+(highlight.trim()?'':'disabled')+'>К отчёту</button></div></section>';
  }
  const question = questions[reviewStep];
  if (!question) return renderReport();
  const status = question.status==="none" ? "Пока без отметки" : answerNames[question.status];
  return '<h2 class="page-title">Итоги недели</h2><p class="review-kicker">Вопрос '+(reviewStep+1)+' из '+questions.length+' · '+weekLabel(report.start)+'</p>'+
    '<progress class="review-progress" aria-label="Номер вопроса" value="'+(reviewStep+1)+'" max="'+questions.length+'"></progress>'+
    '<section class="card review-card"><p class="review-current">'+categoryTitle(question.g)+' · '+status+'</p><h3>'+esc(question.text)+'</h3>'+
    '<p class="review-question" id="review-prompt">'+reviewPrompts[question.status]+'</p>'+
    '<div class="note-heading"><label for="review-answer">Твой ответ</label><button type="button" class="dictation" data-dictate="review-answer">🎙 Диктовать</button></div>'+
    '<textarea class="field" id="review-answer" aria-describedby="review-prompt" data-review-answer="'+esc(question.id)+'" rows="4" placeholder="Расскажи своими словами">'+esc(question.answer)+'</textarea>'+
    '<p class="voice-status" id="review-answer-status" role="status"></p>'+
    '<div class="report-toolbar">'+(reviewStep>0?'<button class="secondary" data-review-move="-1">Назад</button>':'')+
    '<button class="primary" data-review-move="1" id="review-next" '+(question.answer?'':'disabled')+'>Дальше</button></div></section>'+
    '<button class="secondary full" data-goto="report">К черновику отчёта</button>';
}
function openReview(monday) {
  weekDate = monday;
  const report = weekReport();
  const questions = reviewQuestions(report);
  const {closed,highlight} = reviewCompletion(report,questions);
  if (closed) { showPage("report"); return; }
  const pending = questions.findIndex(question=>!question.answer);
  reviewStep = pending>=0 ? pending : highlight ? 0 : questions.length;
  showPage("review");
}
function moveReview(step) {
  if (activeDictation) { activeDictation.recognition.stop(); return; }
  const questions = reviewQuestions(weekReport());
  if (step>0 && !questions[reviewStep]?.answer) return;
  reviewStep = Math.max(0,reviewStep+step);
  render();
  window.scrollTo(0,0);
}
function finishReview() {
  if (activeDictation) { activeDictation.recognition.stop(); return; }
  const report = weekReport();
  if (reviewCompletion(report,reviewQuestions(report)).ready) showPage("report");
}
function closeWeek() {
  const report = weekReport();
  const questions = reviewQuestions(report);
  const {ready,closed} = reviewCompletion(report,questions);
  if (!ready || closed) return;
  (d.closedWeeks||={})[report.start] = {at:new Date().toISOString(),ids:questions.map(question=>question.id)};
  save();
  render();
}
function reopenWeek() {
  const monday = startWeek(weekDate);
  if (d.closedWeeks?.[monday]) {
    delete d.closedWeeks[monday];
    save();
  }
  openReview(monday);
}
function renderReport() {
  const report = weekReport();
  const ext = d.notes[report.start] || {};
  return '<h2 class="page-title">Отчёт недели</h2><div class="report-period"><span>'+weekLabel(report.start)+'</span><input id="week-date" type="date" aria-label="Выбрать неделю отчёта" class="field" style="width:auto" value="'+weekDate+'"></div>'+
    weekVisual(report)+visitVisual(report.start)+reviewCard(report)+reflectionCard(ext)+
    (report.start===startWeek(localDate()) && summarizeWeeks([shift(report.start,-7)]).size
      ? '<button class="secondary full" data-review-week="'+shift(report.start,-7)+'">Анкета за прошлую неделю</button>' : '')+
    '<label class="checkboxrow"><input type="checkbox" id="share-why" '+(ext.includeWhy?'checked':'')+'>Добавить причины переносов в разбор ChatGPT</label>'+
    '<div class="report-toolbar"><button class="secondary" data-copy-analysis="week">Скопировать для ChatGPT</button></div>';
}
function renderProgress(){let all=Object.entries(d.days),actions=all.reduce((sum,[_,x])=>sum+x.items.length,0),done=all.reduce((sum,[_,x])=>sum+Object.values(x.answers).filter(v=>v.status==="done").length,0);let start=startWeek(localDate());let month=localDate().slice(0,7),previous=localDate(new Date(new Date().getFullYear(),new Date().getMonth()-1,1)).slice(0,7),cur=d.months[month]||{},prev=d.months[previous]||{};return '<h2 class="page-title no-print">Аналитика</h2>'+renderMonthly()+'<div class="no-print"><div class="card"><div class="grid3"><div class="metric"><b>'+all.length+'</b><span class="muted">дней с данными</span></div><div class="metric"><b>'+actions+'</b><span class="muted">выбрано</span></div><div class="metric"><b>'+done+'</b><span class="muted">выполнено</span></div></div></div><div class="card"><h3>Мои топ-3 намерения</h3>'+SECTIONS.map((s,i)=>'<button class="choice '+(d.top.includes(i)?'active':'')+'" data-top="'+i+'">'+(d.top.includes(i)?'★ ':'☆ ')+esc(s[0])+'</button>').join("")+'</div><div class="card"><h3>Месячная самооценка</h3><p class="muted">Оцени каждую сферу от 1 до 10. Приложение сравнит оценки с предыдущим месяцем.</p>'+["Отношения","Здоровье","Деятельность","Окружение"].map((x,i)=>'<label>'+x+' · было '+(prev[i]||"—")+', сейчас '+(cur[i]||"—")+'</label><input type="range" min="1" max="10" value="'+(cur[i]||5)+'" data-month="'+i+'">').join("")+'<label>Что изменилось и что могло повлиять?</label><textarea class="field" id="month-note" rows="3" placeholder="Мои мысли и наблюдения...">'+esc(cur.note||"")+'</textarea></div><div class="card"><h3>Резервная копия</h3><p class="muted">Данные хранятся в этом браузере на iPhone. Регулярно сохраняй копию, особенно перед очисткой Safari.</p><button class="secondary full" data-export="1">Скачать резервную копию JSON</button></div><a href="/logout" class="muted">Выйти из приложения</a></div>'}
function render() {

function showPage(next) {

document.addEventListener("click",async e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.nav||b.dataset.goto){showPage(b.dataset.nav||b.dataset.goto);return}if(b.dataset.pulseZone){selectPulseZone(b);return}if(b.dataset.dictate){dictate(b);return}if(b.dataset.reviewWeek){openReview(b.dataset.reviewWeek);return}if(b.dataset.reviewFinish){finishReview();return}if(b.dataset.closeWeek){closeWeek();return}if(b.dataset.reopenWeek){reopenWeek();return}if(b.dataset.reviewMove){moveReview(Number(b.dataset.reviewMove));return}if(b.dataset.copyAnalysis){await copyAnalysis(b.dataset.copyAnalysis==="month");return}if(b.dataset.print){printMonth();return}if(b.dataset.viewPeriod){monthPeriod=Number(b.dataset.viewPeriod);render();return}if(b.dataset.add){updateWeekPlan(b.dataset.add);return}if(b.dataset.state){recordAnswer(b.dataset.state).status=b.dataset.val;save();render();return}if(b.dataset.addCustom){let v=$("custom-text").value.trim();if(!v)return;let id="user-"+Date.now();(d.hyp[goal]||(d.hyp[goal]=[])).push({id,text:v});if(b.dataset.addCustom==="week"){const monday=startWeek(selectedDate);(d.plans ||= {})[monday]=[...plannedFor(selectedDate),id];if(!d.firstReportWeek||monday<d.firstReportWeek)d.firstReportWeek=monday}save();render();return}if(b.dataset.top){let i=Number(b.dataset.top);d.top=d.top.includes(i)?d.top.filter(v=>v!==i):d.top.length<3?[...d.top,i]:d.top;save();render();return}if(b.dataset.export){let blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="moi-namereniya-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
document.addEventListener("change",e=>{let t=e.target;if(t.dataset.progress){recordAnswer(t.dataset.progress).progress=t.value;save();render();}if(t.id==="month-period"){monthPeriod=Number(t.value);render()}if(t.id==="goal-select"){goal=Number(t.value);render()}if(t.id==="week-date"&&t.value){weekDate=t.value;render()}if(t.id==="share-why"){(d.notes[startWeek(weekDate)]||(d.notes[startWeek(weekDate)]={})).includeWhy=t.checked;save();render()}if(t.dataset.month){(d.months[localDate().slice(0,7)]||(d.months[localDate().slice(0,7)]={}))[t.dataset.month]=Number(t.value);save();render()}});
document.addEventListener("input",e=>{let t=e.target;
if(t.dataset.reviewAnswer){
