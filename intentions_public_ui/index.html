<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f6e7ed"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Намерения"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><title>Мои намерения</title>
<style>
*{box-sizing:border-box}body{background:#fcf9fa;color:#463947;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;padding:0 0 85px}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:linear-gradient(125deg,#f6e0e9,#ede6f6);padding:22px 17px 25px;border-radius:0 0 26px 26px}header .eyebrow{font-size:11px;letter-spacing:1.6px;font-weight:750;color:#845e7a}h1{font-size:27px;line-height:1.2;margin:9px 0 6px}header p{margin:0;font-size:13px;color:#795e71}.wrap{padding:17px;max-width:720px;margin:auto}.card{border:1px solid #ecdfe7;background:white;border-radius:17px;padding:15px;margin-bottom:12px;box-shadow:0 2px 7px #a66a8010}h2{font-size:19px;margin:8px 0 13px}h3{font-size:15px;margin:0 0 9px}.muted{font-size:12px;color:#917d8b;line-height:1.45}.small{font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{font-size:12px;color:#8d6482;background:#f5e9f0;border-radius:20px;padding:6px 9px;display:inline-block}.primary,.secondary{border-radius:11px;border:0;padding:11px 14px;font-weight:700}.primary{background:#985b80;color:white}.secondary{background:#f3e9ef;color:#7b4b69}.full{width:100%;margin-top:10px}.choice{display:block;width:100%;border:1px solid #eddee7;background:white;padding:12px;border-radius:12px;text-align:left;margin:7px 0;line-height:1.35}.choice.active{background:#f7eaf1;border-color:#aa7295}.field{width:100%;border:1px solid #eadde5;border-radius:11px;padding:12px;background:white;color:#463947;margin:7px 0 10px}label{display:block;font-size:12px;color:#806b7a;font-weight:650;margin-top:9px}textarea{resize:vertical;min-height:60px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fffefef2;border-top:1px solid #eadce5;padding:8px 5px max(9px,env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:20}.tabs button{border:0;background:transparent;color:#9f8c9b;font-size:10px;padding:6px 2px;min-width:50px}.tabs button.active{color:#8f4e77;font-weight:800}.tabs span{font-size:19px;display:block;margin-bottom:3px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{border:1px solid #e9dae4;background:white;border-radius:9px;text-align:center;padding:11px 1px;font-size:12px}.day.active{background:#eacddf;border-color:#a35c87}.chip{padding:8px;border:1px solid #e7d9e3;border-radius:10px;background:white;font-size:12px}.chip.active{background:#95587c;color:white}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metric{text-align:center;background:#f6edf2;border-radius:13px;padding:11px 4px}.metric b{font-size:22px;display:block}.line{border-top:1px solid #eee3e9;margin:12px 0}.notice{background:#f8eef3;border-radius:13px;padding:12px;font-size:13px;color:#76576b;line-height:1.4}.hidden{display:none}.checkboxrow{display:flex;align-items:center;gap:9px}.checkboxrow input{accent-color:#985b80;width:18px;height:18px}.legend{font-size:11px;color:#927c8d}.link{background:none;border:0;text-decoration:underline;color:#8f5279;padding:5px}input[type=range]{width:100%;accent-color:#9a6285}
</style></head><body><header><div class="eyebrow">МОЯ КАРТА РАЗВИТИЯ 2026</div><h1>Мои намерения ✿</h1><p>Каждый день — маленький шаг к желаемой жизни</p></header><main id="main" class="wrap"></main><nav class="tabs" id="tabs"></nav>
<script>
(function(){
"use strict";
const SECTIONS=[["Здоровье и тело","Я забочусь о своём здоровье и энергии.",["Прогуляться 30 минут","Выбрать приятную физическую активность","Подготовить полезный завтрак","Запланировать время отдыха"]],["Женственность","Я уделяю внимание красоте и внутренней гармонии.",["Записать три желания","Выделить время для себя","Составить список вдохновляющих занятий"]],["Отношения","Я развиваю тёплые, доверительные отношения.",["Организовать совместный вечер","Поблагодарить партнёра","Обсудить общие планы","Предложить новое совместное занятие"]],["Деятельность","Я развиваюсь в любимом деле.",["Сделать один шаг по проекту","Подготовить публикацию","Попросить обратную связь","Подвести итоги проекта"]],["Деньги","Я развиваю свою финансовую устойчивость.",["Проанализировать расходы","Подготовить предложение клиенту","Изучить новую возможность заработка"]],["Уровень нормы","Я постепенно повышаю качество повседневной жизни.",["Записать желания","Выбрать приятную активность","Попробовать новое место"]],["Окружение","Я развиваю интересные знакомства и дружбу.",["Написать знакомому человеку","Посетить интересное мероприятие","Предложить совместную встречу"]],["Дом и уют","Я создаю комфортную домашнюю атмосферу.",["Продумать интерьер","Сделать небольшой шаг к уюту","Выбрать идею домашнего оформления"]]];
const $=id=>document.getElementById(id), esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let d;try{d=JSON.parse(localStorage.getItem("my-intentions-private-v1")||"null")}catch(e){} if(!d)d={hyp:{},days:{},top:[0,3,4],notes:{},months:{},identity:"#participant"};
const save=()=>localStorage.setItem("my-intentions-private-v1",JSON.stringify(d));
const localDate=dt=>{let t=dt||new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
const shift=(iso,n)=>{let v=new Date(iso+"T12:00:00");v.setDate(v.getDate()+n);return localDate(v)};
const startWeek=iso=>{let n=(new Date(iso+"T12:00:00").getDay()+6)%7;return shift(iso,-n)};
const dateText=iso=>new Date(iso+"T12:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
const key=(g,i)=>g+"-"+i;
function allHyp(g){let base=SECTIONS[g][2].map((text,i)=>({id:key(g,i),text:text}));return base.concat((d.hyp[g]||[]).map(x=>({id:x.id,text:x.text})))}
function labelFor(id){for(let g=0;g<8;g++){let x=allHyp(g).find(h=>h.id===id);if(x)return {g,text:x.text}}return {g:0,text:id}}
function dayObj(iso){return d.days[iso]||(d.days[iso]={items:[],answers:{},diary:""})}
function addToDate(iso,id){let a=dayObj(iso);if(a.items.includes(id))a.items=a.items.filter(x=>x!==id);else a.items.push(id);save();if(page==="choose"){const count=a.items.length;const countEl=document.getElementById("selected-count");if(countEl)countEl.textContent=String(count);const btn=document.querySelector("[data-goto=today].primary");if(btn)btn.textContent="✓ Готово · Посмотреть мои "+count+" гипотез";document.querySelectorAll("[data-add]").forEach(b=>{const on=a.items.includes(b.dataset.add);b.classList.toggle("active",on);const mark=b.querySelector("span");if(mark)mark.textContent=on?"☑":"☐"});}else render()}
let page="today",selectedDate=localDate(),goal=2,weekDate=localDate();
let sectionNames=[["today","◉","Сегодня"],["choose","✳","Гипотезы"],["calendar","▦","Календарь"],["report","▤","Отчёт"],["progress","◷","Аналитика"]];
function navbar(){$("tabs").innerHTML=sectionNames.map(x=>'<button class="'+(page===x[0]?'active':'')+'" data-nav="'+x[0]+'"><span>'+x[1]+'</span>'+x[2]+'</button>').join("")}
function dayCard(iso){let a=dayObj(iso);return '<div class="card"><div class="row"><b>Мой день · '+dateText(iso)+'</b><span class="pill">'+a.items.length+' гипотез</span></div><div class="line"></div>'+ (a.items.length?a.items.map(id=>{let h=labelFor(id),v=a.answers[id]||{},cnt=Object.keys(d.days).filter(when=>d.days[when].answers[id]?.status==="post").length,prior=Object.keys(d.days).filter(when=>when<iso&&d.days[when].answers[id]?.status==="done").sort(),last=prior.length?d.days[prior[prior.length-1]].answers[id]:null,completedCount=prior.length+(v.status==="done"?1:0),stalled=prior.length>=2&&v.progress==="no";return '<div class="card" style="box-shadow:none"><div class="muted">'+esc(SECTIONS[h.g][0])+'</div><h3>'+esc(h.text)+'</h3><div class="row" style="justify-content:flex-start;flex-wrap:wrap">'+[["done","✓ Сделано"],["partial","Частично"],["post","Отложила"]].map(x=>'<button class="chip '+(v.status===x[0]?'active':'')+'" data-state="'+esc(id)+'" data-val="'+x[0]+'">'+x[1]+'</button>').join("")+'</div><label>'+(v.status==="done"?"Что именно сделано?":v.status==="partial"?"Что удалось сделать частично?":"Комментарий (необязательно)")+'</label><textarea class="field" rows="2" data-comment="'+esc(id)+'" placeholder="'+(v.status==="done"?"Опиши конкретный результат, например: подготовила и опубликовала пост":v.status==="partial"?"Что уже получилось?":"Мои впечатления и наблюдения")+'">'+esc(v.note)+'</textarea>'+(v.status==="done"&&last?'<div class="notice"><b>Прошлый результат:</b> '+esc(last.note||"Отмечено без комментария")+'</div><label>Что изменилось по сравнению с прошлой попыткой?</label><textarea class="field" rows="2" data-difference="'+esc(id)+'" placeholder="В чём новый результат или отличие?">'+esc(v.difference)+'</textarea><label>Есть продвижение к намерению?</label><select class="field" data-progress="'+esc(id)+'"><option value="" '+(!v.progress?'selected':'')+'>Пока не оценила</option><option value="yes" '+(v.progress==='yes'?'selected':'')+'>Да, есть новый результат</option><option value="same" '+(v.progress==='same'?'selected':'')+'>Поддерживаю результат / полезная привычка</option><option value="no" '+(v.progress==='no'?'selected':'')+'>Нет, всё повторяется без продвижения</option></select>' :'')+(stalled?'<div class="notice"><b>Пора пересмотреть подход.</b> Ты отмечала выполнение минимум три раза, но сейчас не видишь продвижения. Можно изменить действие или обсудить ситуацию с ментором.</div>':'')+(v.status==="post"?'<label>Почему отложила?</label><textarea class="field" rows="2" data-reason="'+esc(id)+'" placeholder="Что помешало?">'+esc(v.reason)+'</textarea>':'')+(cnt>=3?'<div class="notice">Гипотеза переносилась '+cnt+' раза. Возможно, стоит изменить шаг или подход.</div>':'')+'<button class="link" data-remove="'+esc(id)+'">Убрать из этого дня</button></div>'}).join(""):'<p class="muted">Здесь пока нет гипотез. Добавь их из своей карты.</p>')+'<button class="secondary full" data-goto="choose">+ Выбрать гипотезы</button><label>Мои впечатления о дне</label><textarea class="field" data-diary rows="2" placeholder="Что сегодня произошло?">'+esc(a.diary)+'</textarea></div>'}
function renderToday(){return '<h2>Сегодня — движение вперёд</h2><div class="card"><div class="row"><b>Выбранная дата</b><input id="date-field" type="date" value="'+selectedDate+'" class="field" style="width:auto;margin:0"></div></div>'+weekPicker(selectedDate)+dayCard(selectedDate)}
function weekPicker(iso){let monday=startWeek(iso);return '<div class="week">'+Array.from({length:7},(_,i)=>{let date=shift(monday,i),entries=d.days[date]?.items.length||0;return '<button class="day '+(date===selectedDate?'active':'')+'" data-date="'+date+'">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i]+'<br><b>'+date.slice(-2)+'</b><br>'+(entries?'●':'○')+'</button>'}).join("")+'</div><br>'}
function renderChoose(){let count=dayObj(selectedDate).items.length;return '<h2>Выбери гипотезы</h2><div class="notice">Можно выбрать сразу несколько гипотез из разных намерений. Все выбранные попадут в твой день автоматически.</div><div class="card"><label>Намерение</label><select id="goal-select" class="field">'+SECTIONS.map((g,i)=>'<option value="'+i+'" '+(i===goal?'selected':'')+'>'+esc(g[0])+'</option>').join("")+'</select><p class="muted">'+esc(SECTIONS[goal][1])+'</p><label>На какую дату?</label><input id="target-date" type="date" class="field" value="'+selectedDate+'"></div><div class="card"><div class="row"><h3 style="margin:0">Гипотезы</h3><span class="pill">'+allHyp(goal).length+' в намерении</span></div><p class="muted">Нажимай на любые гипотезы — галочки сохраняются, даже если переключаешь намерение.</p>'+allHyp(goal).map(h=>'<button class="choice '+(dayObj(selectedDate).items.includes(h.id)?'active':'')+'" data-add="'+esc(h.id)+'"><span style="display:inline-block;width:25px;font-size:18px;color:#91577a">'+(dayObj(selectedDate).items.includes(h.id)?'☑':'☐')+'</span>'+esc(h.text)+'</button>').join("")+'</div><div class="card"><h3>Добавить своё</h3><textarea class="field" id="custom-text" rows="2" placeholder="Новая гипотеза или действие"></textarea><div class="row"><button class="secondary" data-add-custom="hyp">+ Гипотеза в карту</button><button class="secondary" data-add-custom="today">+ На этот день</button></div></div><div class="card" style="position:sticky;bottom:76px;z-index:10;box-shadow:0 8px 30px #aa7a9940"><div class="row"><b>Выбрано на '+dateText(selectedDate)+'</b><span class="pill" id="selected-count">'+count+'</span></div><button class="primary full" data-goto="today">✓ Готово · Посмотреть мои '+count+' гипотез</button></div>'}
function renderCalendar(){return '<h2>Календарь активности</h2><div class="card"><label>Выбери неделю</label><input id="week-date" type="date" class="field" value="'+weekDate+'"></div>'+weekPicker(weekDate)+'<div class="card"><h3>Записи за неделю</h3>'+Array.from({length:7},(_,i)=>{let dt=shift(startWeek(weekDate),i),a=d.days[dt],n=a?.items.length||0;return '<button data-date="'+dt+'" class="choice"><b>'+dateText(dt)+'</b> · '+(n?n+' гипотез':'Нет записи')+' <span style="float:right">›</span></button>'}).join("")+'<p class="muted">Нет записи ≠ нет действий. Можно заполнить прошедшую дату.</p></div>'}
function recordsInWeek(date){let mo=startWeek(date),out=[];for(let i=0;i<7;i++){let iso=shift(mo,i),a=d.days[iso];if(a)for(let id of a.items){let v=a.answers[id]||{},h=labelFor(id);out.push({iso,id,g:h.g,text:h.text,status:v.status||"none",note:v.note||"",reason:v.reason||"",difference:v.difference||"",progress:v.progress||""})}}return out}
function weekReport(){let arr=recordsInWeek(weekDate), by={};for(let r of arr){if(!by[r.g])by[r.g]=[];by[r.g].push(r)}let start=startWeek(weekDate),end=shift(start,6),ext=d.notes[start]||{},names={done:"Выполнено",partial:"Частично",post:"Отложено",none:"Без отметки"};let txt="Недельный отчёт\n"+(d.identity||"#participant")+" "+start.split("-").reverse().join(".")+"–"+end.split("-").reverse().join(".")+"\n\n";if(ext.extra)txt+=ext.extra+"\n\n";Object.keys(by).sort((a,b)=>a-b).forEach(g=>{txt+=SECTIONS[g][0]+"\n\n"+SECTIONS[g][1]+"\n\n"+by[g].map(r=>r.text+" — "+names[r.status]+(r.note?". "+r.note:"")+(r.difference?" Отличие от прошлого раза: "+r.difference:"")+(ext.includeWhy&&r.reason?" Причина: "+r.reason:"")).join("\n")+"\n\n"});txt+="Самоуважение — "+(ext.respect??80)+"%\nВовлечённость — "+(ext.engagement??80)+"%\nУровень счастья — "+(ext.happiness??80)+"%";return {txt,start,arr}}
function renderReport(){let r=weekReport(),ext=d.notes[r.start]||{},byDone=r.arr.filter(x=>x.status==="done").length,miss=r.arr.filter(x=>x.status==="post").length,days=new Set(r.arr.map(x=>x.iso)).size;return '<h2>Недельный отчёт</h2><div class="notice">В программе окно сдачи открывается в пятницу на 24–48 часов. Здесь ты можешь проверить отчёт в любой день.</div><div class="card"><label>Неделя</label><input id="week-date" type="date" class="field" value="'+weekDate+'"><div class="grid3"><div class="metric"><b>'+days+'/7</b><span class="muted">дней с записями</span></div><div class="metric"><b>'+byDone+'</b><span class="muted">сделано</span></div><div class="metric"><b>'+miss+'</b><span class="muted">переносов</span></div></div><label>Дополнительные результаты и впечатления</label><textarea class="field" id="report-extra" rows="3" placeholder="Что ещё произошло за неделю?">'+esc(ext.extra)+'</textarea><div class="grid3">'+[["respect","Самоуважение"],["engagement","Вовлечённость"],["happiness","Счастье"]].map(x=>'<div><label>'+x[1]+'</label><input class="field" type="number" min="0" max="100" data-score="'+x[0]+'" value="'+(ext[x[0]]??80)+'"></div>').join("")+'</div><label class="checkboxrow"><input type="checkbox" id="share-why" '+(ext.includeWhy?'checked':'')+'>Включить причины переносов в отчёт</label></div><div class="card"><h3>Предпросмотр для Telegram</h3><pre id="preview" style="white-space:pre-wrap;font:13px -apple-system,system-ui;line-height:1.55">'+esc(r.txt)+'</pre></div><button class="primary full" data-copy="report">Скопировать отчёт</button><button class="secondary full" data-share="report">Поделиться в Telegram</button><p class="muted">Ничего не отправляется автоматически. Перед отправкой ты сама проверяешь текст.</p>'}
function renderProgress(){let all=Object.entries(d.days),actions=all.reduce((sum,[_,x])=>sum+x.items.length,0),done=all.reduce((sum,[_,x])=>sum+Object.values(x.answers).filter(v=>v.status==="done").length,0);let start=startWeek(localDate());let month=localDate().slice(0,7),previous=localDate(new Date(new Date().getFullYear(),new Date().getMonth()-1,1)).slice(0,7),cur=d.months[month]||{},prev=d.months[previous]||{};return '<h2>Моя динамика</h2><div class="card"><div class="grid3"><div class="metric"><b>'+all.length+'</b><span class="muted">дней с данными</span></div><div class="metric"><b>'+actions+'</b><span class="muted">выбрано</span></div><div class="metric"><b>'+done+'</b><span class="muted">выполнено</span></div></div></div><div class="card"><h3>Мои топ-3 намерения</h3>'+SECTIONS.map((s,i)=>'<button class="choice '+(d.top.includes(i)?'active':'')+'" data-top="'+i+'">'+(d.top.includes(i)?'★ ':'☆ ')+esc(s[0])+'</button>').join("")+'</div><div class="card"><h3>Месячная самооценка</h3><p class="muted">Оцени каждую сферу от 1 до 10. Приложение сравнит оценки с предыдущим месяцем.</p>'+["Отношения","Здоровье","Деятельность","Окружение"].map((x,i)=>'<label>'+x+' · было '+(prev[i]||"—")+', сейчас '+(cur[i]||"—")+'</label><input type="range" min="1" max="10" value="'+(cur[i]||5)+'" data-month="'+i+'">').join("")+'<label>Что изменилось и что могло повлиять?</label><textarea class="field" id="month-note" rows="3" placeholder="Мои мысли и наблюдения...">'+esc(cur.note||"")+'</textarea></div><div class="card"><h3>Резервная копия</h3><p class="muted">Данные хранятся в этом браузере на iPhone. Регулярно сохраняй копию, особенно перед очисткой Safari.</p><button class="secondary full" data-export="1">Скачать резервную копию JSON</button></div><a href="/logout" class="muted">Выйти из приложения</a>'}
function render(){navbar();$("main").innerHTML=page==="today"?renderToday():page==="choose"?renderChoose():page==="calendar"?renderCalendar():page==="report"?renderReport():renderProgress()}
document.addEventListener("click",async e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.nav){page=b.dataset.nav;render();return}if(b.dataset.goto){page=b.dataset.goto;render();return}if(b.dataset.date){selectedDate=b.dataset.date;weekDate=b.dataset.date;page="today";render();return}if(b.dataset.add){addToDate(selectedDate,b.dataset.add);return}if(b.dataset.remove){addToDate(selectedDate,b.dataset.remove);return}if(b.dataset.state){let v=dayObj(selectedDate).answers[b.dataset.state]||{};v.status=b.dataset.val;dayObj(selectedDate).answers[b.dataset.state]=v;save();render();return}if(b.dataset.addCustom){let v=$("custom-text").value.trim();if(!v)return;let id="user-"+Date.now();if(b.dataset.addCustom==="hyp"){(d.hyp[goal]||(d.hyp[goal]=[])).push({id,text:v})}else{(d.hyp[goal]||(d.hyp[goal]=[])).push({id,text:v});dayObj(selectedDate).items.push(id)}save();render();return}if(b.dataset.top){let i=Number(b.dataset.top);d.top=d.top.includes(i)?d.top.filter(v=>v!==i):d.top.length<3?[...d.top,i]:d.top;save();render();return}if(b.dataset.copy){try{await navigator.clipboard.writeText(weekReport().txt);alert("Отчёт скопирован")}catch(x){alert("Не удалось скопировать")};return}if(b.dataset.share){window.open("https://t.me/share/url?url=&text="+encodeURIComponent(weekReport().txt),"_blank");return}if(b.dataset.export){let blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="moi-namereniya-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
document.addEventListener("change",e=>{let t=e.target;if(t.dataset.progress){(dayObj(selectedDate).answers[t.dataset.progress]||(dayObj(selectedDate).answers[t.dataset.progress]={})).progress=t.value;save();render();}if(t.id==="goal-select"){goal=Number(t.value);render()}if(t.id==="date-field"||t.id==="target-date"){selectedDate=t.value;render()}if(t.id==="week-date"){weekDate=t.value;selectedDate=t.value;render()}if(t.id==="share-why"){(d.notes[startWeek(weekDate)]||(d.notes[startWeek(weekDate)]={})).includeWhy=t.checked;save();render()}if(t.dataset.score){(d.notes[startWeek(weekDate)]||(d.notes[startWeek(weekDate)]={}))[t.dataset.score]=Number(t.value);save();render()}if(t.dataset.month){(d.months[localDate().slice(0,7)]||(d.months[localDate().slice(0,7)]={}))[t.dataset.month]=Number(t.value);save();render()}});
document.addEventListener("input",e=>{let t=e.target;if(t.dataset.comment){(dayObj(selectedDate).answers[t.dataset.comment]||(dayObj(selectedDate).answers[t.dataset.comment]={})).note=t.value;save()}if(t.dataset.reason){(dayObj(selectedDate).answers[t.dataset.reason]||(dayObj(selectedDate).answers[t.dataset.reason]={})).reason=t.value;save()}if(t.dataset.difference){(dayObj(selectedDate).answers[t.dataset.difference]||(dayObj(selectedDate).answers[t.dataset.difference]={})).difference=t.value;save()}if(t.dataset.diary!==undefined){dayObj(selectedDate).diary=t.value;save()}if(t.id==="report-extra"){(d.notes[startWeek(weekDate)]||(d.notes[startWeek(weekDate)]={})).extra=t.value;save()}if(t.id==="month-note"){(d.months[localDate().slice(0,7)]||(d.months[localDate().slice(0,7)]={})).note=t.value;save()}});
render();
fetch("/api/hypotheses",{credentials:"same-origin"}).then(r=>{if(!r.ok)throw Error("private data unavailable");return r.json()}).then(a=>{if(Array.isArray(a)&&a.length===8){SECTIONS.splice(0,8,...a);render()}}).catch(()=>{});
})();
